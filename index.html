  <!-- Automatic Cache-Busting HTTP Headers (Forces Browsers Never to Store Disk Cache) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Automatic Browser Cache Purge Engine -->
  <script>
    (function() {
      const CURRENT_APP_VERSION = 'v18.0';
      const storedVersion = localStorage.getItem('ag_auto_cache_version');
      if (storedVersion !== CURRENT_APP_VERSION) {
        localStorage.setItem('ag_auto_cache_version', CURRENT_APP_VERSION);
        if ('caches' in window) {
          caches.keys().then(names => {
            for (let name of names) caches.delete(name);
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let registration of registrations) registration.unregister();
          });
        }
      }
    })();
  </script>

  <!-- Thai Official Government & Professional Web Fonts (Sarabun Standard) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
